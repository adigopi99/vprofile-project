version: "3.8"
services:
  vprodb:
    build:
      context: ./Docker-files/db
      image: vprocontainers/vprodb
      container_name: vprodb
      ports:
        - "3306:3306"
      volumes:
        vprodbdata:/var/lib/mysql
      environment:
        MYSQL_ROOT_PASSWORD="vprodbpass"


  vprocache01:
    
volumes:
  vprodbdata: {}
  vproappdata: {}
